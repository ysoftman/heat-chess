<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heat Chess</title>
    <style>
      :root {
        --bg: #14110f;
        --fg: #ece5df;
        --light: #b9a894;
        --dark: #6f5b48;
        --accent: #ff7a1a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 24px 12px 40px;
        background: radial-gradient(120% 90% at 50% 0%, #2a1d14, var(--bg));
        color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: linear-gradient(90deg, #ffd08a, var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #status {
        min-height: 24px;
        font-weight: 600;
      }
      #board {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        width: min(92vw, 560px);
        aspect-ratio: 1;
        border: 3px solid #3b2c22;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 12px 40px #0009;
      }
      .sq {
        position: relative;
        display: grid;
        place-items: center;
        cursor: pointer;
        user-select: none;
      }
      .light {
        background: var(--light);
      }
      .dark {
        background: var(--dark);
      }
      .sel {
        box-shadow: inset 0 0 0 3px var(--accent);
      }
      .pc {
        font-size: min(9vw, 46px);
        line-height: 1;
        color: #1b1512;
      }
      .w {
        color: #fffaf4;
        text-shadow: 0 1px 2px #0008;
      }
      .hot {
        filter: drop-shadow(0 0 calc(var(--h) * 4px) hsl(calc(45 - var(--h) * 15) 100% 55%));
      }
      .locked {
        opacity: 0.4;
      }
      .badge {
        position: absolute;
        top: 2px;
        right: 3px;
        font-size: min(2.6vw, 12px);
        font-weight: 700;
        padding: 0 4px;
        border-radius: 6px;
        background: #ff6a00;
        color: #fff;
      }
      .badge.cold {
        background: #3b82f6;
      }
      .target::after {
        content: "";
        position: absolute;
        width: 26%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: #0006;
      }
      .target.capture::after {
        width: 82%;
        background: none;
        border: 4px solid #0006;
      }
      #controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      button,
      select {
        font: inherit;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid #5a4535;
        background: #251b15;
        color: var(--fg);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      p.rules {
        max-width: 560px;
        margin: 0;
        text-align: center;
        opacity: 0.65;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Heat Chess</h1>
    <div id="status">백 차례</div>
    <div id="board"></div>
    <div id="controls">
      <button type="button" id="new">새 게임</button>
      <select id="mode">
        <option value="ai">vs AI</option>
        <option value="two">2인 플레이</option>
      </select>
      <select id="depth">
        <option value="1">쉬움</option>
        <option value="2" selected>보통</option>
        <option value="3">어려움 (느림)</option>
      </select>
    </div>
    <p class="rules">
      기물을 움직이면 heat +1, 쉬면 -1. heat 4 에 닿으면 과열되어 2턴간 움직일 수
      없다 (파란 배지). 킹은 과열되지 않는다.
    </p>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
